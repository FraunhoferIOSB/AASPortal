<div class="h-100">
    <fhg-doc-header [document]="document()"></fhg-doc-header>
    <fhg-sensor-measurement-value [document]="document()" [submodel]="submodel()"></fhg-sensor-measurement-value>
    @if (count() >= 2) {
        <ngb-pagination
            [collectionSize]="count()"
            [(page)]="index"
            [pageSize]="1"
            [directionLinks]="count() > 5"
            [ellipses]="true"
        />
    }
</div>

<ng-template #toolbar>
    <div class="w-100">
        <h2 translate="SensorMeasurementValue.TITLE"></h2>
        <div class="d-node d-sm-flex flex-row">
            <div class="me-2 my-1">
                <button
                    class="btn btn-outline-primary"
                    type="button"
                    (click)="addToStart().subscribe()"
                    ngbTooltip="{{ 'SensorMeasurementValue.ADD_TO_START_TOOLTIP' | translate }}"
                    placement="bottom"
                    [openDelay]="300"
                    [closeDelay]="500"
                >
                    <i class="bi bi-house-add"></i>
                    <div class="d-none d-lg-inline px-2">
                        <span translate="SensorMeasurementValue.ADD_TO_START"></span>
                    </div>
                </button>
            </div>
        </div>
    </div>
</ng-template>
