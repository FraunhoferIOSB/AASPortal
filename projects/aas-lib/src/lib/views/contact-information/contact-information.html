<div ngbAccordion>
    @for (contact of contacts(); track contact; let i = $index) {
        <div class="p-3 m-auto bg-body-tertiary border border-black border-opacity-25 rounded-2">
            <div class="p-4">
                <p class="fw-semibold">Contact</p>
                <div class="row">
                    <div class="col-md-6">
                        <div class="col-sm d-flex flex-column data-entry">
                            <label class="label">{{ getContactInformationValue(i, 'RoleOfContactPerson') }}</label>
                            <label>{{ getContactInformationValue(i, 'ContactInformation') }}</label>
                        </div>
                        <div class="col-sm d-flex flex-column data-entry">
                            <label class="label" translate="Nameplate.SERIAL_NUMBER">Phone</label>
                            <label>{{ getContactInformationValue(i, 'Phone') }}</label>
                        </div>
                        <div class="col-sm d-flex flex-column data-entry">
                            <label class="label" translate="Nameplate.SERIAL_NUMBER">Email</label>
                            <label>{{ getContactInformationValue(i, 'Email') }}</label>
                        </div>
                    </div>

                    <div class="col-md-6 d-flex flex-column mt-5 m-md-0">
                        <label class="fw-semibold">{{ getContactInformationValue(i, 'Company') }}</label>
                        <label>{{ getContactInformationValue(i, 'Street') }}</label>
                        <label
                            >{{ getContactInformationValue(i, 'CityTown') }}
                            {{ getContactInformationValue(i, 'NationalCode') }}</label
                        >
                        <label>{{ getContactInformationValue(i, 'Zipcode') }}</label>
                    </div>
                </div>
            </div>
        </div>
    }
</div>
