<div class="h-100">
    <fhg-doc-header [document]="document()"></fhg-doc-header>
    <fhg-nameplate [document]="document()" [state]="nameplateState"></fhg-nameplate>
</div>

<ng-template #toolbar>
    <div class="d-block">
        <h2 translate="Nameplate.TITLE"></h2>
        <div class="d-node d-sm-flex flex-row">
            <div class="me-2 my-1">
                <button
                    class="btn btn-outline-primary"
                    type="button"
                    (click)="addToStart().subscribe()"
                    ngbTooltip="{{ 'Nameplate.ADD_TO_START_TOOLTIP' | translate }}"
                    placement="bottom"
                    [openDelay]="300"
                    [closeDelay]="500"
                >
                    <i class="bi bi-house-add"></i>
                    <div class="d-none d-lg-inline px-2">
                        <span translate="Nameplate.ADD_TO_START"></span>
                    </div>
                </button>
            </div>
        </div>
    </div>
    @if (count() >= 2) {
        <div class="input-group my-1">
            <ngb-pagination
                [collectionSize]="count()"
                [(page)]="index"
                [pageSize]="1"
                [directionLinks]="count() > 5"
                [ellipses]="true"
            />
        </div>
    }
</ng-template>
