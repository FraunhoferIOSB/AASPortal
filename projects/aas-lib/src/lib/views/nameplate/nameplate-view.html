<div>
    <div class="mt-1">
        <fhg-doc-header [document]="document()"></fhg-doc-header>
    </div>
    <div class="mt-3">
        <fhg-nameplate [document]="document()" [state]="nameplateState"></fhg-nameplate>
    </div>
</div>

<ng-template #toolbar>
    <div class="w-100">
        <div class="row mb-1">
            <h2 class="col" translate="Nameplate.TITLE"></h2>
            <button
                class="btn btn-outline-primary border-0 col-auto"
                type="button"
                (click)="addToStart().subscribe()"
                ngbTooltip="{{ 'Nameplate.ADD_TO_START_TOOLTIP' | translate }}"
                placement="bottom"
                container="body"
                [openDelay]="300"
                [closeDelay]="500"
            >
                <i class="bi bi-house-add"></i>
                <div class="d-none d-lg-inline px-2">
                    <span translate="Nameplate.ADD_TO_START"></span>
                </div>
            </button>
        </div>
        @if (count() >= 2) {
            <div class="row mb-1">
                <div class="col">
                    <ngb-pagination
                        [collectionSize]="count()"
                        [(page)]="index"
                        [pageSize]="1"
                        [directionLinks]="count() > 5"
                        [ellipses]="true"
                    />
                </div>
            </div>
        }
    </div>
</ng-template>
