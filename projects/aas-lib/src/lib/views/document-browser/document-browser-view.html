@if (count() > 0) {
    <div class="h-100">
        <div class="mb-3">
            <fhg-doc-header [document]="document()"></fhg-doc-header>
        </div>
        <fhg-browser
            [env]="content()"
            [endpoint]="$safeNavigationMigration(document()?.endpoint)"
            [state]="browserState"
        ></fhg-browser>
    </div>
} @else {
    <div class="alert alert-info text-center mt-2" role="alert" translate="Browser.EMPTY"></div>
}

<ng-template #browserToolbar>
    <div class="w-100">
        <h2 translate="DocumentBrowser.CAPTION"></h2>
        <div class="input-group me-2 my-1">
            <button
                class="btn btn-outline-primary my-1"
                type="button"
                (click)="addToStart().subscribe()"
                ngbTooltip="{{ 'DocumentBrowser.ADD_TO_START_TOOLTIP' | translate }}"
                placement="bottom"
                [openDelay]="300"
                [closeDelay]="500"
            >
                <i class="bi bi-house-add"></i>
                <div class="d-inline px-2">
                    <span translate="DocumentBrowser.ADD_TO_START"></span>
                </div>
            </button>
        </div>
        @if (count() >= 2) {
            <div class="input-group my-1">
                <ngb-pagination
                    [collectionSize]="count()"
                    [(page)]="index"
                    [pageSize]="1"
                    [directionLinks]="count() > 5"
                    [ellipses]="true"
                />
            </div>
        }
    </div>
</ng-template>
