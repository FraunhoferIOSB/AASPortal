<div class="card-header d-flex flex-row justify-content-between align-items-center">
    <div class="fs-5 fw-medium">{{ caption() | translate }}</div>
    <a [href]="href()">
        <i class="bi bi-chevron-right"></i>
    </a>
</div>
<div class="card-body">
    <div class="d-flex flex-column">
        <div class="d-flex flex-row mb-2">
            <img [height]="128" [src]="thumbnail()" alt="assets/resources/aas-portal.svg" />
            <div class="d-flex flex-column ms-2">
                @for (detail of detailItems(); track detail) {
                    <div class="fs-8 text-body-secondary text-nowrap text-truncate overflow-hidden">
                        {{ detail.name | translate }}
                    </div>
                    <div class="mb-1 mt-n1 text-truncate text-nowrap overflow-hidden">{{ detail.value }}</div>
                }
            </div>
        </div>
        @for (note of noteItems(); track note) {
            <div>{{ note }}</div>
        }
    </div>
</div>
