<div class="h-100 w-100 px-3 overflow-y-auto overflow-x-hidden">
    <!-- Header of AAS View -->
    @if (document()) {
        <fhg-doc-header [document]="document()"></fhg-doc-header>
        <!-- Body of AAS View -->
        <div class="row row-cols-1 row-cols-sm-1 row-cols-md-1 row-cols-lg-1 row-cols-xl-2 row-cols-xxl-2 mt-2">
            @for (submodel of getSubmodels(); track submodel) {
                <div class="col text-nowrap text-truncate">
                    <ng-container
                        *ngTemplateOutlet="submodelCardTemplate; context: { submodel: submodel }"
                    ></ng-container>
                </div>
            }
        </div>
    } @else if (error() === 'permission') {
        <div class="alert alert-warning text-center mt-2" role="alert">
            <i class="bi bi-shield-lock me-2"></i>
            <span translate="AAS.NO_PERMISSION"></span>
            <div class="mt-2">
                <button
                    type="button"
                    class="btn btn-sm btn-outline-primary"
                    (click)="openEndpointAuth().subscribe()"
                    translate="AAS.ADD_API_KEY"
                ></button>
            </div>
        </div>
    } @else if (error() === 'other') {
        <div class="alert alert-danger text-center mt-2" role="alert" translate="AAS.LOAD_FAILED"></div>
    } @else {
        <div class="alert alert-info text-center mt-2" role="alert" translate="AAS.EMPTY"></div>
    }
</div>

<!-- Toolbar -->
<ng-template #toolbar>
    <div class="w-100 d-none d-sm-block">
        <h2 class="mb-1" translate="AAS.CAPTION"></h2>
        <div class="d-flex flex-row">
            <div class="button-group me-2 my-1">
                <button
                    class="btn btn-outline-primary my-1"
                    type="button"
                    (click)="addToStart().subscribe()"
                    ngbTooltip="{{ 'AAS.ADD_TO_START_TOOLTIP' | translate }}"
                    placement="bottom"
                    [openDelay]="300"
                    [closeDelay]="500"
                >
                    <i class="bi bi-house-add"></i>
                    <div class="d-none d-lg-inline px-2">
                        <span translate="AAS.ADD_TO_START"></span>
                    </div>
                </button>
            </div>
            <div class="button-group ms-auto me-2 my-1">
                <button
                    [routerLink]="openContentView()"
                    type="button"
                    class="btn btn-outline-primary me-2 my-1"
                    ngbTooltip="{{ 'AAS.OPEN_CONTENT_VIEW_TOOLTIP' | translate }}"
                    placement="bottom"
                    [openDelay]="300"
                    [closeDelay]="500"
                >
                    <i class="bi bi-diagram-3"></i>
                    <div class="d-none d-lg-inline px-2">
                        <span translate="AAS.OPEN_CONTENT_VIEW"></span>
                    </div>
                </button>
                <button
                    [routerLink]="openBrowserView()"
                    type="button"
                    class="btn btn-outline-primary my-1"
                    ngbTooltip="{{ 'AAS.OPEN_BROWSER_VIEW_TOOLTIP' | translate }}"
                    placement="bottom"
                    [openDelay]="300"
                    [closeDelay]="500"
                >
                    <i class="bi bi-box-arrow-in-down"></i>
                    <div class="d-none d-lg-inline px-2">
                        <span translate="AAS.OPEN_BROWSER_VIEW"></span>
                    </div>
                </button>
            </div>
        </div>
    </div>
</ng-template>

<ng-template #submodelCardTemplate let-submodel="submodel">
    <a
        [routerLink]="openSubmodelView(submodel)"
        class="fhg-submodel-card d-flex flex-row my-1 py-2 px-3 border border-1 border-black border-opacity-50 rounded-3 align-items-center text-decoration-none text-body overflow-hidden"
    >
        <div class="me-4 fs-4">
            <i class="bi" [ngClass]="getSubmodelIcon(submodel)"></i>
        </div>
        <div class="d-flex flex-column me-4 overflow-hidden">
            <label class="text-body-secondary fs-7 text-truncate">{{
                getSubmodelSemanticId(submodel) | max: 55 : 0.55
            }}</label>
            <h4>{{ submodel.idShort }}</h4>
        </div>
        <div class="ms-auto text-primary fs-4">
            <i class="bi bi-chevron-right"></i>
        </div>
    </a>
</ng-template>
