<div class="overflow-y-auto overflow-x-hidden h-100 w-100 px-3">
    @if (isEmpty()) {
        @let html = welcome();
        @if (html) {
            <div id="AID_MD_CONTENT" [innerHTML]="html"></div>
        } @else {
            <div class="position-absolute top-50 start-50 translate-middle">
                <div class="spinner-border text-primary fhg-spinner-lg" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        }
    } @else {
        <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 row-cols-xl-3">
            @for (item of items(); track item.id; let i = $index) {
                <div class="p-2 rounded col" [class.bg-info-subtle]="item.selected()">
                    <div
                        class="card overflow-hidden"
                        (click)="toggleSelected($event, item)"
                        tabindex="0"
                        style="height: 280px;"
                    >
                        <ng-container
                            [ngComponentOutlet]="item.component"
                            [ngComponentOutletInputs]="item.inputs"
                        ></ng-container>
                    </div>
                </div>
            }
        </div>
    }
</div>

<ng-template #toolbar>
    <div class="w-100">
        <div class="mb-1">
            <h2 translate="Start.CAPTION"></h2>
        </div>

        <div class="d-flex flex-row">
            <div class="input-group me-2 my-1">
                <button
                    id="AID_REMOVE"
                    class="btn btn-outline-primary"
                    type="button"
                    (click)="remove().subscribe()"
                    [disabled]="!someSelected()"
                    ngbTooltip="{{ 'Start.REMOVE_TOOLTIP' | translate }}"
                    placement="bottom"
                    [openDelay]="300"
                    [closeDelay]="500"
                >
                    <i class="bi bi-trash"></i>
                </button>
                <button
                    id="AID_MOVE_LEFT"
                    class="btn btn-outline-primary"
                    type="button"
                    (click)="moveLeft().subscribe()"
                    [disabled]="!canMoveLeft()"
                    ngbTooltip="{{ 'Start.MOVE_LEFT_TOOLTIP' | translate }}"
                    placement="bottom"
                    [openDelay]="300"
                    [closeDelay]="500"
                >
                    <i class="bi bi-arrow-left"></i>
                </button>
                <button
                    id="AID_MOVE_RIGHT"
                    class="btn btn-outline-primary"
                    type="button"
                    (click)="moveRight().subscribe()"
                    [disabled]="!canMoveRight()"
                    ngbTooltip="{{ 'Start.MOVE_RIGHT_TOOLTIP' | translate }}"
                    placement="bottom"
                    [openDelay]="300"
                    [closeDelay]="500"
                >
                    <i class="bi bi-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
</ng-template>
